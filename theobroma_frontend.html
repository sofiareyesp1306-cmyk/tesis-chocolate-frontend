<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Theobroma – Análisis de Chocolate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a0a00;
      color: #f5e6d0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      color: #d4a043;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #a07040;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }

    .card {
      background: #2c1505;
      border: 1px solid #5a3010;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.1rem;
      color: #d4a043;
      margin-bottom: 20px;
      border-bottom: 1px solid #5a3010;
      padding-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: #b08050;
      margin-bottom: 4px;
      margin-top: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px 12px;
      background: #1a0a00;
      border: 1px solid #5a3010;
      border-radius: 8px;
      color: #f5e6d0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #d4a043;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #d4a043;
      color: #1a0a00;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #e8b855; }
    button:disabled { background: #6b5020; color: #a07040; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .msg.error { background: #4a1010; color: #ff9090; border: 1px solid #801010; }
    .msg.success { background: #0a3010; color: #90e090; border: 1px solid #105010; }
    .msg.info { background: #1a2a40; color: #90c0ff; border: 1px solid #204080; }

    .upload-area {
      border: 2px dashed #5a3010;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 14px;
      position: relative;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: #d4a043;
      background: #3a1a05;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .upload-text { color: #a07040; font-size: 0.9rem; }
    .upload-filename { color: #d4a043; font-size: 0.9rem; margin-top: 8px; font-weight: 600; }

    #preview-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 14px;
      display: none;
    }

    .json-box {
      background: #0d0500;
      border: 1px solid #5a3010;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 350px;
      overflow-y: auto;
      color: #90e0a0;
      display: none;
    }

    .btn-download {
      background: #2a5020;
      color: #90e090;
      margin-top: 12px;
      display: none;
    }

    .btn-download:hover { background: #3a7030; }

    .hidden { display: none !important; }

    .tag-logged {
      font-size: 0.8rem;
      color: #90c060;
      background: #0a2010;
      border: 1px solid #205010;
      border-radius: 20px;
      padding: 3px 12px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #1a0a00;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1>🍫 Theobroma</h1>
  <p class="subtitle">Análisis de calidad con IA · Producción de chocolate</p>

  <!-- LOGIN -->
  <div class="card" id="card-login">
    <h2>Iniciar sesión</h2>
    <label>Correo electrónico</label>
    <input type="email" id="login-email" placeholder="tucorreo@ejemplo.com" />
    <label>Contraseña</label>
    <input type="password" id="login-pass" placeholder="••••••••" />
    <button onclick="login()">Entrar</button>
    <div id="login-msg"></div>
  </div>

  <!-- UPLOAD -->
  <div class="card hidden" id="card-upload">
    <h2>Analizar muestra</h2>
    <div class="tag-logged" id="user-tag">👤 Usuario</div>

    <label>Etapa de producción</label>
    <select id="etapa-select">
      <option value="tostado">🔥 Tostado</option>
      <option value="refinado">⚙️ Refinado</option>
      <option value="moldeado">🍫 Moldeado</option>
    </select>

    <label>Foto de la muestra</label>
    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept="image/*" onchange="onFileSelected(event)" />
      <div class="upload-icon">📷</div>
      <div class="upload-text">Haz clic o arrastra una foto aquí</div>
      <div class="upload-filename" id="filename-label"></div>
    </div>

    <img id="preview-img" alt="Vista previa" />

    <button id="btn-analizar" onclick="analizar()" disabled>Analizar con IA</button>
    <div id="upload-msg"></div>

    <div class="json-box" id="json-result"></div>
    <button class="btn-download" id="btn-download" onclick="descargarJSON()">⬇ Descargar JSON</button>

    <button onclick="logout()" style="margin-top:30px; background:#3a1010; color:#ff9090;">Cerrar sesión</button>
  </div>

<script>
  const API = "https://web-production-0b0f9.up.railway.app";
  let token = null;
  let nombreUsuario = "";
  let ultimoJSON = null;
  let ultimaEtapa = "";

  function showMsg(id, texto, tipo) {
    const el = document.getElementById(id);
    el.className = "msg " + tipo;
    el.innerHTML = texto;
    el.style.display = texto ? "block" : "none";
  }

  async function login() {
    const email = document.getElementById("login-email").value.trim();
    const pass = document.getElementById("login-pass").value;

    if (!email || !pass) {
      showMsg("login-msg", "Completa todos los campos.", "error");
      return;
    }

    showMsg("login-msg", '<span class="spinner"></span>Ingresando...', "info");

    try {
      const resp = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, contraseña: pass })
      });

      const data = await resp.json();

      if (!resp.ok) {
        showMsg("login-msg", data.detail || "Error al iniciar sesión.", "error");
        return;
      }

      token = data.token;
      nombreUsuario = data.nombre;

      document.getElementById("card-login").classList.add("hidden");
      document.getElementById("card-upload").classList.remove("hidden");
      document.getElementById("user-tag").textContent = "👤 " + nombreUsuario;
      showMsg("login-msg", "", "");

    } catch (e) {
      showMsg("login-msg", "No se pudo conectar con el servidor.", "error");
    }
  }

  function onFileSelected(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById("filename-label").textContent = file.name;
    document.getElementById("btn-analizar").disabled = false;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.getElementById("preview-img");
      img.src = e.target.result;
      img.style.display = "block";
    };
    reader.readAsDataURL(file);

    // Reset resultado anterior
    document.getElementById("json-result").style.display = "none";
    document.getElementById("btn-download").style.display = "none";
    showMsg("upload-msg", "", "");
  }

  // Drag & drop
  const area = document.getElementById("upload-area");
  area.addEventListener("dragover", e => { e.preventDefault(); area.classList.add("dragover"); });
  area.addEventListener("dragleave", () => area.classList.remove("dragover"));
  area.addEventListener("drop", e => {
    e.preventDefault();
    area.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    if (file) {
      document.getElementById("file-input").files = e.dataTransfer.files;
      onFileSelected({ target: { files: [file] } });
    }
  });

  async function analizar() {
    const fileInput = document.getElementById("file-input");
    const etapa = document.getElementById("etapa-select").value;

    if (!fileInput.files[0]) {
      showMsg("upload-msg", "Selecciona una foto primero.", "error");
      return;
    }

    showMsg("upload-msg", '<span class="spinner"></span>Analizando con IA... esto puede tardar unos segundos.', "info");
    document.getElementById("btn-analizar").disabled = true;
    document.getElementById("json-result").style.display = "none";
    document.getElementById("btn-download").style.display = "none";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
      const resp = await fetch(`${API}/upload/${etapa}`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });

      const data = await resp.json();

      if (!resp.ok) {
        showMsg("upload-msg", data.detail || "Error en el análisis.", "error");
        document.getElementById("btn-analizar").disabled = false;
        return;
      }

      ultimoJSON = data;
      ultimaEtapa = etapa;

      const jsonStr = JSON.stringify(data, null, 2);
      const box = document.getElementById("json-result");
      box.textContent = jsonStr;
      box.style.display = "block";

      document.getElementById("btn-download").style.display = "block";
      showMsg("upload-msg", "✅ Análisis completado.", "success");

    } catch (e) {
      showMsg("upload-msg", "Error de conexión con el servidor.", "error");
    } finally {
      document.getElementById("btn-analizar").disabled = false;
    }
  }

  function descargarJSON() {
    if (!ultimoJSON) return;
    const blob = new Blob([JSON.stringify(ultimoJSON, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const fecha = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    a.href = url;
    a.download = `theobroma_${ultimaEtapa}_${fecha}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function logout() {
    token = null;
    nombreUsuario = "";
    ultimoJSON = null;
    document.getElementById("card-login").classList.remove("hidden");
    document.getElementById("card-upload").classList.add("hidden");
    document.getElementById("login-email").value = "";
    document.getElementById("login-pass").value = "";
    document.getElementById("file-input").value = "";
    document.getElementById("filename-label").textContent = "";
    document.getElementById("preview-img").style.display = "none";
    document.getElementById("json-result").style.display = "none";
    document.getElementById("btn-download").style.display = "none";
    showMsg("upload-msg", "", "");
  }

  // Enter key en login
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !document.getElementById("card-login").classList.contains("hidden")) {
      login();
    }
  });
</script>
</body>
</html>
